    <canvas id="waveCanvas"></canvas>

    <script>
    (function(){
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        function resize(){
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        /* define wave lines */
        const waves = [
            { amp:38, period:0.008, speed:0.0018, yFrac:0.18, color:'rgba(189,85,120,0.35)', width:1.8, offset:0 },
            { amp:28, period:0.010, speed:0.0025, yFrac:0.30, color:'rgba(133,57,83,0.30)', width:1.4, offset:1 },
            { amp:50, period:0.006, speed:0.0013, yFrac:0.45, color:'rgba(189,85,120,0.20)', width:2.2, offset:2 },
            { amp:22, period:0.013, speed:0.0030, yFrac:0.58, color:'rgba(255,138,176,0.25)', width:1.2, offset:3 },
            { amp:42, period:0.007, speed:0.0020, yFrac:0.70, color:'rgba(133,57,83,0.22)', width:1.8, offset:4 },
            { amp:30, period:0.011, speed:0.0015, yFrac:0.82, color:'rgba(189,85,120,0.18)', width:1.5, offset:5 },
            { amp:55, period:0.005, speed:0.0010, yFrac:0.92, color:'rgba(255,138,176,0.15)', width:2.5, offset:6 },
        ];

        let t = 0;
        function draw(){
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            waves.forEach(w => {
                ctx.beginPath();
                ctx.lineWidth   = w.width;
                ctx.strokeStyle = w.color;
                const baseY = canvas.height * w.yFrac;
                for(let x = 0; x <= canvas.width; x += 2){
                    const y = baseY + Math.sin(x * w.period + t * w.speed * 60 + w.offset) * w.amp;
                    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();
            });
            t += 1;
            requestAnimationFrame(draw);
        }
        draw();
    })();
    </script>
